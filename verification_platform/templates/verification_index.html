<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeneBridge - Document Verification Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            padding: 0;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            color: white;
            padding: 40px 50px;
            border-radius: 12px;
            margin-bottom: 40px;
            box-shadow: 0 10px 40px rgba(15, 52, 96, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .bank-logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .header p {
            opacity: 0.85;
            font-size: 15px;
            font-weight: 400;
        }

        .security-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .upload-section {
            background: white;
            padding: 45px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            border: 1px solid #e8ecf1;
        }

        .upload-section h2 {
            margin-bottom: 10px;
            color: #1a202c;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .upload-section .subtitle {
            color: #718096;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .file-upload-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .file-upload {
            background: #f8f9fb;
            border: 2px dashed #cbd5e0;
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s ease;
            position: relative;
        }

        .file-upload:hover {
            border-color: #4299e1;
            background: #ebf8ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(66, 153, 225, 0.1);
        }

        .file-upload label {
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
            color: #2d3748;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: #4299e1;
            border-radius: 6px;
            color: white;
            text-align: center;
            line-height: 24px;
            font-size: 14px;
        }

        .file-upload input[type="file"] {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            background: white;
        }

        .file-upload input[type="file"]::file-selector-button {
            background: #4299e1;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            margin-right: 10px;
        }

        .file-upload input[type="file"]::file-selector-button:hover {
            background: #3182ce;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 40px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            letter-spacing: 0.3px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .submit-btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .results-section {
            display: none;
        }

        .results-section.show {
            display: block;
        }

        .step {
            background: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e8ecf1;
            transition: all 0.3s ease;
        }

        .step:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        .step-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .step-title {
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .step-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50%;
            font-size: 13px;
            font-weight: 700;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-success {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-warning {
            background: linear-gradient(135deg, #fff3cd 0%, #ffe69c 100%);
            color: #856404;
            border: 1px solid #ffe69c;
        }

        .status-processing {
            background: linear-gradient(135deg, #cce5ff 0%, #b8daff 100%);
            color: #004085;
            border: 1px solid #b8daff;
        }

        .step-data {
            background: #f7fafc;
            padding: 16px;
            border-radius: 8px;
            margin-top: 12px;
            border-left: 4px solid #667eea;
        }

        .step-data pre {
            margin: 0;
            font-size: 12px;
            white-space: pre-wrap;
            color: #4a5568;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
        }

        .issues-section {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .issues-section h3 {
            color: #721c24;
            margin-bottom: 10px;
        }

        .issues-section ul {
            margin-left: 20px;
            color: #721c24;
        }

        .approval-section {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            border-left: 6px solid #28a745;
            padding: 35px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(40, 167, 69, 0.15);
        }

        .approval-section h2 {
            color: #155724;
            margin-bottom: 10px;
            font-size: 26px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .approval-section p {
            color: #2d5016;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .payout-details {
            background: white;
            padding: 28px;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border: 1px solid #e8ecf1;
        }

        .payout-row {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #f1f3f5;
            font-size: 15px;
        }

        .payout-row:last-child {
            border-bottom: none;
            font-weight: 700;
            font-size: 22px;
            color: #28a745;
            padding-top: 18px;
            margin-top: 8px;
            border-top: 2px solid #e8ecf1;
        }

        .download-btn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a73e8;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <div class="bank-logo">
                    <div class="logo-icon">BB</div>
                    <div>
                        <h1>Beneficiary Claim Processing System</h1>
                        <p>Internal Operations Platform - Community National Bank</p>
                    </div>
                </div>
                <div class="security-badge">
                    🔒 Secure Platform
                </div>
            </div>
        </div>

        <div class="upload-section">
            <h2>Upload Required Documents</h2>
            <p class="subtitle">Upload all three required documents to begin the automated verification process</p>
            <form id="uploadForm">
                <div class="file-upload-grid">
                    <div class="file-upload">
                        <label for="death_cert">
                            <span class="file-icon">📄</span>
                            Death Certificate (PDF)
                        </label>
                        <input type="file" id="death_cert" name="death_cert" accept=".pdf" required>
                    </div>

                    <div class="file-upload">
                        <label for="government_id">
                            <span class="file-icon">🪪</span>
                            Beneficiary Driver's License (PDF/PNG/JPG)
                        </label>
                        <input type="file" id="government_id" name="government_id" accept=".pdf,.png,.jpg,.jpeg" required>
                    </div>

                    <div class="file-upload">
                        <label for="claim_form">
                            <span class="file-icon">📋</span>
                            Beneficiary Claim Form (PDF)
                        </label>
                        <input type="file" id="claim_form" name="claim_form" accept=".pdf" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Process Claim</button>
            </form>
        </div>

        <div id="loadingSection" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Processing documents and verifying claim...</p>
        </div>

        <div id="resultsSection" class="results-section">
            <!-- Results will be inserted here -->
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const submitBtn = document.getElementById('submitBtn');
            const loadingSection = document.getElementById('loadingSection');
            const resultsSection = document.getElementById('resultsSection');

            // Show loading
            submitBtn.disabled = true;
            loadingSection.style.display = 'block';
            resultsSection.classList.remove('show');

            try {
                const response = await fetch('/api/process_verification', {
                    method: 'POST',
                    body: formData
                });

                const results = await response.json();

                // Hide loading
                loadingSection.style.display = 'none';

                // Display results
                displayResults(results);
                resultsSection.classList.add('show');

            } catch (error) {
                alert('Error processing claim: ' + error.message);
                loadingSection.style.display = 'none';
            }

            submitBtn.disabled = false;
        });

        function displayResults(results) {
            const resultsSection = document.getElementById('resultsSection');
            let html = '';

            // Show issues if any
            if (results.issues && results.issues.length > 0) {
                html += `
                    <div class="issues-section">
                        <h3>⚠️ Issues Detected</h3>
                        <ul>
                            ${results.issues.map(issue => `<li>${issue}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            // Show steps
            results.steps.forEach(step => {
                html += `
                    <div class="step">
                        <div class="step-header">
                            <span class="step-title">
                                <span class="step-number">${step.step}</span>
                                ${step.name}
                            </span>
                            <span class="status-badge status-${step.status}">${step.status}</span>
                        </div>
                        ${step.data ? `
                            <div class="step-data">
                                <pre>${JSON.stringify(step.data, null, 2)}</pre>
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            // Show approval section if approved
            if (results.final_approval && results.payout) {
                const payout = results.payout;
                html += `
                    <div class="approval-section">
                        <h2><span style="font-size: 32px;">✅</span> Claim Approved for Processing</h2>
                        <p>All verifications passed. Transfer can be initiated.</p>

                        <div class="payout-details">
                            <div class="payout-row">
                                <span>Account Balance:</span>
                                <span>$${payout.account_balance.toLocaleString('en-US', {minimumFractionDigits: 2})}</span>
                            </div>
                            <div class="payout-row">
                                <span>Beneficiary Percentage:</span>
                                <span>${payout.beneficiary_percentage}%</span>
                            </div>
                            <div class="payout-row">
                                <span>Account Type:</span>
                                <span>${payout.account_type}</span>
                            </div>
                            <div class="payout-row">
                                <span>Routing Number:</span>
                                <span>${payout.routing_number}</span>
                            </div>
                            <div class="payout-row">
                                <span><strong>Transfer Amount:</strong></span>
                                <span><strong>$${payout.payout_amount.toLocaleString('en-US', {minimumFractionDigits: 2})}</strong></span>
                            </div>
                        </div>

                        <button class="download-btn" onclick="downloadApprovalDoc()">
                            📥 Download Approval Document
                        </button>
                    </div>
                `;
            }

            resultsSection.innerHTML = html;
        }

        let currentResults = null;

        // Override displayResults to store results
        const originalDisplayResults = displayResults;
        displayResults = function(results) {
            currentResults = results;
            originalDisplayResults(results);
        };

        function downloadApprovalDoc() {
            if (!currentResults) {
                alert('No results available to download');
                return;
            }

            // Send results to server to generate PDF
            fetch('/api/generate_approval_doc', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(currentResults)
            })
            .then(response => response.blob())
            .then(blob => {
                // Create download link
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `Claim_Approval_${currentResults.timestamp}.pdf`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error generating approval document: ' + error.message);
            });
        }
    </script>
</body>
</html>
