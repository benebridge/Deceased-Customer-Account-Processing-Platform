<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Verification - BeneBridge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 2rem;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: #64748b;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        .upload-section {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            text-align: center;
            transition: all 0.3s;
        }
        .upload-section:hover {
            border-color: #667eea;
            background: #f1f5f9;
        }
        .upload-section.active {
            border-color: #10b981;
            background: #d1fae5;
        }
        .upload-label {
            font-weight: 600;
            color: #1e293b;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: block;
        }
        .upload-input {
            display: none;
        }
        .upload-btn {
            background: #667eea;
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-block;
            user-select: none;
        }
        .upload-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .file-info {
            margin-top: 1rem;
            color: #059669;
            font-weight: 600;
        }
        .blockchain-input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            margin-top: 1rem;
            font-family: 'Courier New', monospace;
        }
        .verify-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 1.25rem 3rem;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 2rem;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .verify-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }
        .verify-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            display: none;
        }
        .status.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }
        .status.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }
        .info-box {
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
            padding: 1rem;
            margin-top: 2rem;
            border-radius: 4px;
        }
        .info-box strong {
            display: block;
            margin-bottom: 0.5rem;
            color: #1e40af;
        }
        .checkmark {
            color: #10b981;
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Document Verification</h1>
        <p class="subtitle">Upload death certificate, government ID, and claim form for verification</p>

        <form id="verification-form">
            <!-- Death Certificate Upload -->
            <div class="upload-section" id="death-cert-section">
                <label class="upload-label">Death Certificate</label>
                <input type="file" id="death-cert-input" name="death_cert" class="upload-input" accept=".pdf,.png,.jpg,.jpeg">
                <button type="button" class="upload-btn" id="death-cert-btn">Choose File</button>
                <div class="file-info" id="death-cert-info"></div>
            </div>

            <!-- ID Upload -->
            <div class="upload-section" id="id-section">
                <label class="upload-label">Government-Issued ID</label>
                <input type="file" id="id-input" name="government_id" class="upload-input" accept=".pdf,.png,.jpg,.jpeg">
                <button type="button" class="upload-btn" id="id-btn">Choose File</button>
                <div class="file-info" id="id-info"></div>
            </div>

            <!-- Claim Form Upload -->
            <div class="upload-section" id="claim-section">
                <label class="upload-label">Beneficiary Claim Form</label>
                <input type="file" id="claim-input" name="claim_form" class="upload-input" accept=".pdf,.png,.jpg,.jpeg">
                <button type="button" class="upload-btn" id="claim-btn">Choose File</button>
                <div class="file-info" id="claim-info"></div>
            </div>

            <!-- Verify Button -->
            <button type="submit" id="verify-btn" class="verify-btn" disabled>Verify Documents</button>
        </form>

        <div id="status" class="status"></div>

        <div class="info-box">
            <strong>✓ Completely Private</strong>
            All verification happens on your local computer. Your documents never leave your machine.
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing file upload handlers');

            let deathCertFile = null;
            let idFile = null;
            let claimFormFile = null;

            // Button click handlers to trigger file inputs
            document.getElementById('death-cert-btn').addEventListener('click', function() {
                console.log('Death cert button clicked');
                document.getElementById('death-cert-input').click();
            });

            document.getElementById('id-btn').addEventListener('click', function() {
                console.log('ID button clicked');
                document.getElementById('id-input').click();
            });

            document.getElementById('claim-btn').addEventListener('click', function() {
                console.log('Claim button clicked');
                document.getElementById('claim-input').click();
            });

            // Death certificate upload
            document.getElementById('death-cert-input').addEventListener('change', function(e) {
                console.log('Death cert file selected:', e.target.files);
                const file = e.target.files[0];
                if (!file) return;

                deathCertFile = file;
                document.getElementById('death-cert-info').innerHTML =
                    `<span class="checkmark">✓</span> ${file.name} selected`;
                document.getElementById('death-cert-section').classList.add('active');
                checkVerifyButton();
            });

            // ID upload
            document.getElementById('id-input').addEventListener('change', function(e) {
                console.log('ID file selected:', e.target.files);
                const file = e.target.files[0];
                if (!file) return;

                idFile = file;
                document.getElementById('id-info').innerHTML =
                    `<span class="checkmark">✓</span> ${file.name} selected`;
                document.getElementById('id-section').classList.add('active');
                checkVerifyButton();
            });

            // Claim form upload
            document.getElementById('claim-input').addEventListener('change', function(e) {
                console.log('Claim form file selected:', e.target.files);
                const file = e.target.files[0];
                if (!file) return;

                claimFormFile = file;
                document.getElementById('claim-info').innerHTML =
                    `<span class="checkmark">✓</span> ${file.name} selected`;
                document.getElementById('claim-section').classList.add('active');
                checkVerifyButton();
            });

            // Form submission
            document.getElementById('verification-form').addEventListener('submit', async function(e) {
                e.preventDefault();

                const btn = document.getElementById('verify-btn');
                btn.disabled = true;
                btn.textContent = 'Verifying...';

                const formData = new FormData();
                if (deathCertFile) formData.append('death_cert', deathCertFile);
                if (idFile) formData.append('government_id', idFile);
                if (claimFormFile) formData.append('claim_form', claimFormFile);

                try {
                    const response = await fetch('/api/process_verification', {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();

                    if (result.success) {
                        // Display results
                        let statusHtml = '<h3>Verification Results</h3><br>';

                        // Show extracted data
                        if (result.death_cert_data) {
                            statusHtml += '<strong>Death Certificate:</strong><br>';
                            statusHtml += `Deceased: ${result.death_cert_data.deceased_name || 'N/A'}<br>`;
                            statusHtml += `SSN: ${result.death_cert_data.ssn || 'N/A'}<br>`;
                            statusHtml += `Date of Death: ${result.death_cert_data.death_date || 'N/A'}<br><br>`;
                        }

                        if (result.id_data) {
                            statusHtml += '<strong>Government ID:</strong><br>';
                            statusHtml += `Name: ${result.id_data.name || (result.id_data.first_name && result.id_data.last_name ? result.id_data.first_name + ' ' + result.id_data.last_name : 'N/A')}<br>`;
                            statusHtml += `DOB: ${result.id_data.dob || 'N/A'}<br>`;
                            statusHtml += `Address: ${result.id_data.address || 'N/A'}<br><br>`;
                        }

                        if (result.claim_data) {
                            statusHtml += '<strong>Claim Form:</strong><br>';
                            statusHtml += `Beneficiary: ${result.claim_data.beneficiary_name || 'N/A'}<br>`;
                            statusHtml += `Account: ${result.claim_data.account_number || 'N/A'}<br>`;
                            statusHtml += `Beneficiary SSN: ${result.claim_data.beneficiary_ssn || 'N/A'}<br><br>`;
                        }

                        // Show pending APIs
                        statusHtml += '<strong>Status:</strong><br>';
                        statusHtml += 'Verification pending - waiting for Ribbon, Persona, and Bank API integration<br><br>';

                        // Show issues if any
                        if (result.issues && result.issues.length > 0) {
                            statusHtml += '<strong>Issues:</strong><br>';
                            result.issues.forEach(issue => {
                                statusHtml += `⚠️ ${issue}<br>`;
                            });
                        }

                        showStatus(statusHtml, 'success');
                    } else {
                        showStatus('Verification failed: ' + (result.message || 'Unknown error'), 'error');
                    }

                    btn.disabled = false;
                    btn.textContent = 'Verify Documents';

                } catch (error) {
                    showStatus('Verification failed: ' + error.message, 'error');
                    btn.disabled = false;
                    btn.textContent = 'Verify Documents';
                }
            });

            function checkVerifyButton() {
                const btn = document.getElementById('verify-btn');
                // Enable if all three documents are uploaded
                if (deathCertFile && idFile && claimFormFile) {
                    btn.disabled = false;
                }
            }

            function showStatus(message, type) {
                const status = document.getElementById('status');
                status.innerHTML = message;
                status.className = 'status ' + type;
            }
        }); // End of DOMContentLoaded
    </script>
</body>
</html>
