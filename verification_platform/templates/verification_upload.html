<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Verification - BeneBridge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 2rem;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: #64748b;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        .upload-section {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            text-align: center;
            transition: all 0.3s;
        }
        .upload-section:hover {
            border-color: #667eea;
            background: #f1f5f9;
        }
        .upload-section.active {
            border-color: #10b981;
            background: #d1fae5;
        }
        .upload-label {
            font-weight: 600;
            color: #1e293b;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: block;
        }
        .upload-input {
            display: none;
        }
        .upload-btn {
            background: #667eea;
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-block;
        }
        .upload-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .file-info {
            margin-top: 1rem;
            color: #059669;
            font-weight: 600;
        }
        .blockchain-input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            margin-top: 1rem;
            font-family: 'Courier New', monospace;
        }
        .verify-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 1.25rem 3rem;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 2rem;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .verify-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }
        .verify-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            display: none;
        }
        .status.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }
        .status.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }
        .info-box {
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
            padding: 1rem;
            margin-top: 2rem;
            border-radius: 4px;
        }
        .info-box strong {
            display: block;
            margin-bottom: 0.5rem;
            color: #1e40af;
        }
        .checkmark {
            color: #10b981;
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Document Verification</h1>
        <p class="subtitle">Upload your death certificate and ID for secure verification</p>

        <!-- Death Certificate Upload -->
        <div class="upload-section" id="death-cert-section">
            <label class="upload-label">Death Certificate</label>
            <input type="file" id="death-cert-input" class="upload-input" accept=".pdf,.png,.jpg,.jpeg">
            <label for="death-cert-input" class="upload-btn">Choose File</label>
            <div class="file-info" id="death-cert-info"></div>

            <input type="text"
                   id="blockchain-hash"
                   class="blockchain-input"
                   placeholder="Optional: Titan Seal blockchain hash"
                   style="display: none;">
        </div>

        <!-- ID Upload -->
        <div class="upload-section" id="id-section">
            <label class="upload-label">Government-Issued ID</label>
            <input type="file" id="id-input" class="upload-input" accept=".pdf,.png,.jpg,.jpeg">
            <label for="id-input" class="upload-btn">Choose File</label>
            <div class="file-info" id="id-info"></div>
        </div>

        <!-- Verify Button -->
        <button id="verify-btn" class="verify-btn" disabled>Verify Documents</button>

        <div id="status" class="status"></div>

        <div class="info-box">
            <strong>✓ Completely Private</strong>
            All verification happens on your local computer. Your documents never leave your machine.
        </div>
    </div>

    <script>
        let sessionId = null;
        let deathCertUploaded = false;
        let idUploaded = false;

        // Create session on page load
        fetch('/create-session', { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                sessionId = data.session_id;
                console.log('Session created:', sessionId);
            });

        // Death certificate upload
        document.getElementById('death-cert-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('session_id', sessionId);
            formData.append('blockchain_hash', document.getElementById('blockchain-hash').value);

            try {
                const response = await fetch('/upload-death-cert', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    document.getElementById('death-cert-info').innerHTML =
                        `<span class="checkmark">✓</span> ${file.name} uploaded`;
                    document.getElementById('death-cert-section').classList.add('active');
                    document.getElementById('blockchain-hash').style.display = 'block';
                    deathCertUploaded = true;
                    checkVerifyButton();
                } else {
                    showStatus('Error uploading death certificate', 'error');
                }
            } catch (error) {
                showStatus('Upload failed: ' + error.message, 'error');
            }
        });

        // ID upload
        document.getElementById('id-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('session_id', sessionId);

            try {
                const response = await fetch('/upload-id', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    document.getElementById('id-info').innerHTML =
                        `<span class="checkmark">✓</span> ${file.name} uploaded`;
                    document.getElementById('id-section').classList.add('active');
                    idUploaded = true;
                    checkVerifyButton();
                } else {
                    showStatus('Error uploading ID', 'error');
                }
            } catch (error) {
                showStatus('Upload failed: ' + error.message, 'error');
            }
        });

        // Verify button
        document.getElementById('verify-btn').addEventListener('click', async function() {
            this.disabled = true;
            this.textContent = 'Verifying...';

            try {
                const response = await fetch(`/verify/${sessionId}`, {
                    method: 'POST'
                });

                const result = await response.json();

                // Redirect to results page
                window.location.href = `/results/${sessionId}`;

            } catch (error) {
                showStatus('Verification failed: ' + error.message, 'error');
                this.disabled = false;
                this.textContent = 'Verify Documents';
            }
        });

        function checkVerifyButton() {
            const btn = document.getElementById('verify-btn');
            // Enable if at least one document is uploaded
            if (deathCertUploaded || idUploaded) {
                btn.disabled = false;
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
        }
    </script>
</body>
</html>
